[project]
name = "video-explainer-mcp"
version = "0.2.1"
description = "MCP server for synthesizing explainer videos — wraps prajwal-y/video_explainer CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fausto" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Intended Audience :: Developers",
]
# The renderer CLI is installed separately at EXPLAINER_PATH.
dependencies = [
    "fastmcp>=4.0.10,<5",
    "pydantic>=2.13.5,<3",
]

[project.urls]
Homepage = "https://github.com/Galbaz1/video-research-mcp"
Repository = "https://github.com/Galbaz1/video-research-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.9,<0.17",
]

[project.scripts]
video-explainer-mcp = "video_explainer_mcp.server:main"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_explainer_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/video_explainer_mcp/job_store.py" = "video_explainer_mcp/job_store.py"
"src/video_explainer_mcp/media_process.py" = "video_explainer_mcp/media_process.py"

[tool.hatch.build.targets.sdist.force-include]
"../../src/video_research_mcp/job_store.py" = "src/video_explainer_mcp/job_store.py"
"../../src/video_research_mcp/media_process.py" = "src/video_explainer_mcp/media_process.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["unit: fast isolated unit tests (mocked deps)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
