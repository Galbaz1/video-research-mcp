[project]
name = "video-agent-mcp"
version = "0.2.1"
description = "Parallel scene generation for video explainer pipeline via Claude Agent SDK + FastMCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fausto" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]
dependencies = [
    "claude-agent-sdk>=0.2.162,<0.3",
    "fastmcp>=4.0.10,<5",
    "pydantic>=2.13.5,<3",
]

[project.urls]
Homepage = "https://github.com/Galbaz1/video-research-mcp"
Repository = "https://github.com/Galbaz1/video-research-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.9,<0.17",
]

[project.scripts]
video-agent-mcp = "video_agent_mcp.server:main"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_agent_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
